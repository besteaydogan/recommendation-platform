name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress test

      - name: Verify package
        run: bash ./mvnw --batch-mode --no-transfer-progress -DskipTests package
